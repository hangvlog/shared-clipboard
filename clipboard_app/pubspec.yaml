name: clipboard_app
description: 共享剪贴板 - Flutter 移动端（iOS & Android）
version: 1.1.0+3
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 内部 SDK
  clipboard_core:
    path: ../clipboard_core

  # UI & 状态管理
  provider: ^6.1.5

  # HTTP 请求
  http: ^1.4.0

  # 系统剪贴板
  super_clipboard: ^0.9.1

  # 本地存储
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3
  crypto: ^3.0.6

  # 设备信息
  device_info_plus: ^11.3.0

  # 图片处理
  image: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
