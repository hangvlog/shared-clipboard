[package]
name = "shared-clipboard"
version = "1.1.4"
edition = "2021"
build = "build.rs"

[features]
# Isolated synthetic-account runtime; excluded from distributable packages.
qa = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
ring = "0.17"

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
