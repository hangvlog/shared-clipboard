name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        working-directory: ./clipboard_app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --dart-define=ENV=production

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          files: clipboard_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Build iOS
        working-directory: ./clipboard_app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --dart-define=ENV=production

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: clipboard_app/build/ios/iphoneos/Runner.app

      - name: iPhone and iPad simulator build
        working-directory: ./clipboard_app
        run: flutter build ios --simulator --debug --dart-define=ENV=production

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: clipboard_app/build/ios/iphonesimulator/Runner.app
